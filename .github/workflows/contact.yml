name: Test SMTP handler

on:
  push:
    paths: ['server/**', 'scripts/build_hosting.py', 'build.py', 'dist/app.js', '.github/workflows/contact.yml']
  pull_request:
    paths: ['server/**', 'scripts/build_hosting.py', 'build.py', 'dist/app.js', '.github/workflows/contact.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PHP extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-sqlite3 php-zip
      - name: PHP syntax and local SMTP integration
        run: |
          php -v
          find server -name '*.php' -print0 | xargs -0 -n 1 php -l
          PHP_BIN=php python3 server/tests/integration.py
          node --check dist/app.js
      - name: Build package without credentials
        run: python3 scripts/build_hosting.py
